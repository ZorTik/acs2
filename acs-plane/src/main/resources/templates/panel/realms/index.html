<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}"
      lang="en">
<head>
    <title>Realms</title>
</head>
<body>

<div layout:fragment="heading-wrapper">
    <h1 th:replace="~{layouts/general :: heading(title='Realms')}">Realms</h1>
</div>

<div layout:fragment="content">
    <div class="flex gap-4">
        <div class="w-full">
            <div th:replace="~{fragments/component :: block(~{::listing-table}, 'Registered Realms', 'Realms currently registered in the system.')}">
                <th:block th:fragment="listing-table">
                    <table class="w-full">
                        <thead class="text-left">
                        <tr>
                            <th>Realm Name</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="realm : ${realms}">
                            <td th:text="${realm.name}">Realm Name</td>
                            <td class="flex">
                                <a th:href="@{/panel/realms/definitions/raw(realm=${realm.name})}">
                                    <button th:replace="~{fragments/component :: badge-primary(~{::edit-realm}, '!py-1', null)}">
                                        <span th:fragment="edit-realm">Edit</span>
                                    </button>
                                </a>
                                <!-- TODO: Delete -->
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <a th:href="@{/panel/realms/create}">
                        <button th:replace="~{fragments/component :: button-primary(~{::#create-realm-content}, 'mt-4', null)}">
                            <span id="create-realm-content">New Realm</span>
                        </button>
                    </a>
                </th:block>
            </div>
        </div>
    </div>
</div>
</body>
</html>
