<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Button fragments -->
<button th:fragment="button-primary(content, className='', type='button')"
        th:class="'bg-gradient-to-r from-blue-700 to-blue-500 text-white py-2 px-4 rounded-md transition-all duration-300 hover:from-blue-800 hover:to-blue-600' + ${className}"
        th:type="${type}">
    <span th:insert="${content}">Button</span>
</button>

<!-- Layout fragments -->
<div th:fragment="block(content, title)" th:class="'p-4 rounded-md border border-gray-200'">
    <th:block th:if="${title} != null">
        <h2 th:text="${title}" class="text-xl m-0 p-0"></h2>
        <hr class="my-2" />
    </th:block>
    <th:block th:insert="${content}"></th:block>
</div>

</body>
</html>
