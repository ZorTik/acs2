<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <body>
        <!-- Button fragments -->
        <button th:fragment="button-primary(content, className, type)"
                th:class="${className ?: ''} + ' bg-gradient-to-r from-blue-700 to-blue-500 text-white py-2 px-4 rounded-md transition-all duration-300 hover:from-blue-800 hover:to-blue-600'"
                th:type="${type ?: 'button'}">
            <span th:insert="${content}">Button</span>
        </button>

        <!-- Layout fragments -->
        <div th:fragment="block(content, title)" th:class="'p-4 rounded-md border border-gray-200'">
            <th:block th:if="${title} != null">
                <h2 th:text="${title}" class="text-xl m-0 p-0"></h2>
                <hr class="my-4" />
            </th:block>
            <th:block th:insert="${content}"></th:block>
        </div>
    </body>
</html>
