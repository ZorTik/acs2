<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <nav th:fragment="wrapper(header, content, className)" th:class="${className ?: ''} + ' flex flex-col max-w-xs px-12 bg-slate-900 text-slate-200 border-r'">
            <div class="py-5 mb-5 text-center" th:if="${header != null}">
                <th:block th:replace="${header}" />
            </div>

            <ul class="space-y-2" th:if="${content != null}">
                <th:block th:replace="${content}" />
            </ul>
        </nav>

        <li th:fragment="link(href, text, identifier)" th:class="'px-5 py-3 w-48 rounded-md ' + ${navIdentifier == identifier ? 'link-active' : ''}" role="button">
            <a th:href="${href}" th:insert="${text}" class="font-medium px-5 py-3">Link</a>
        </li>
    </body>
</html>
